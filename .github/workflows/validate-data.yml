name: Validate data

# The CSVs in data/ are generated from the cached source payloads in raw/.
# This workflow proves they can still be regenerated byte-for-byte, so the
# numbers in the README are reproducible rather than hand-typed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate every CSV from raw/
        run: |
          python3 scripts/build_data.py
          python3 scripts/build_consolidated.py

      - name: Fail if the regenerated CSVs differ from the committed ones
        run: |
          if ! git diff --quiet -- data/; then
            echo "::error::data/ is out of date - run scripts/build_data.py and commit the result"
            git --no-pager diff --stat -- data/
            exit 1
          fi
          echo "All CSVs reproduce exactly."

      - name: Sanity-check row counts
        run: |
          python3 - <<'PY'
          import csv, sys, os
          expected = {
            "data/aa_leaderboard_271.csv":        271,
            "data/aa_coding_agents.csv":           34,
            "data/openrouter_boards.csv":         612,
            "data/benchlm_axes.csv":               43,
            "data/llmstats.csv":                 408,
            "data/openrouter_model_specs.csv":    468,
            "data/openrouter_variants.csv":         8,
            "data/arena_text_leaderboard.csv":    175,
            "data/consolidated_39_models.csv":     45,
          }
          bad = []
          for path, want in expected.items():
              if not os.path.exists(path):
                  bad.append(f"{path}: MISSING"); continue
              with open(path) as fh:
                  got = sum(1 for _ in csv.DictReader(fh))
              print(f"{path:42} {got:>5} rows (expected {want})")
              if got != want:
                  bad.append(f"{path}: {got} != {want}")
          if bad:
              for b in bad: print("::error::" + b)
              sys.exit(1)
          print("All row counts match.")
          PY

      - name: Verify README exists and is non-trivial
        run: |
          test -s README.md
          wc -l README.md
          grep -q "Artificial Analysis" README.md
          grep -q "Arena" README.md
